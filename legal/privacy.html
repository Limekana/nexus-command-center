<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy — Limecore Studio</title>
<!-- Permanent stub (Limekana/limecore#32). Every app build before v1.17 links
     this URL, and old builds stay installed indefinitely, so it must keep
     resolving. It carries no policy text: the one live policy is at
     limecore.dev/privacy. The hash is kept so #processors still lands. -->
<link rel="canonical" href="https://limecore.dev/privacy">
<script>location.replace('https://limecore.dev/privacy' + location.hash);</script>
<meta http-equiv="refresh" content="0; url=https://limecore.dev/privacy">
<style>
  :root { color-scheme: light dark; --fg:#1a1814; --bg:#f7f5f1; --accent:#3f7d4e; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e4dd; --bg:#14161a; --accent:#7fc08f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:48px 20px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <p>The Limecore Studio privacy policy has moved to
  <a href="https://limecore.dev/privacy">limecore.dev/privacy</a>.</p>
</div>
</body>
</html>
