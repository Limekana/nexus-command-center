# F-Droid metadata for StudyDesk — fdroiddata MR !41551.
# FD-1 Fastlane metadata present (6 locales). FD-2 gradle wrapper SHA present.
# FD-3 FOSS audit PASS (no GMS). LICENSE MIT in repo root.
#
# Reproducible-build target (linsui's request on !41550, applied to all three):
# F-Droid builds from source, then byte-compares against the signed APK at
# `Binaries:`. On a match F-Droid adopts our signing cert, so updates stay
# interchangeable with our GitHub Releases builds.
#
# `fdroid lint` passes clean as of 2026-07-17.
#
# NOTE — the previous pin was raw SHA 4a36e17 (the LICENSE/attribution fix on
# main), which sits AFTER the v1.5.1 tag. So unlike NCC/LimeLog this could not
# simply be repointed at its existing tag without reverting that fix. v1.5.2
# is cut from main including the attribution fix, which resolves it.
Categories:
  - Science & Education
License: MIT
AuthorName: Limecore Studio
SourceCode: https://github.com/Limekana/StudyDesk
IssueTracker: https://github.com/Limekana/StudyDesk/issues

AutoName: StudyDesk

RepoType: git
Repo: https://github.com/Limekana/StudyDesk.git

Binaries: https://github.com/Limekana/StudyDesk/releases/download/v%v/StudyDesk-%v.apk

Builds:
  - versionName: 1.5.2
    versionCode: 11
    commit: v1.5.2
    subdir: android/app
    sudo:
      # Debian's packaged npm pulls Node 18, but @capacitor/cli 8 requires
      # node >=22 (and vite >=22.12) and hard-fails `cap sync`. Install a
      # pinned Node instead of apt's, and verify the tarball — an unverified
      # download is both a supply-chain hole and an fdroiddata review blocker.
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz
      - echo "9749e988f437343b7fa832c69ded82a312e41a03116d766797ac14f6f9eee578  node.tar.xz" | sha256sum -c -
      - tar xJf node.tar.xz --directory /opt
      - ln -s /opt/node-v22.23.1-linux-x64/bin/node /usr/local/bin/node
      - ln -s /opt/node-v22.23.1-linux-x64/bin/npm /usr/local/bin/npm
      - ln -s /opt/node-v22.23.1-linux-x64/bin/npx /usr/local/bin/npx
    init:
      - npm ci
    prebuild:
      - npm run build
      - npx cap sync android
    scandelete:
      # `cap sync` has already copied the built web assets into
      # android/app/src/main/assets, so Gradle no longer needs node_modules.
      # Drop it before the scan: esbuild ships a prebuilt binary and Rollup
      # ships native .node modules, which the fdroidserver scanner rejects.
      - node_modules
    gradle:
      - yes

# Shared Limecore Studio release key (CN=Emil Hongisto, O=Limecore) — the same
# cert signs NCC and LimeLog, so all three ymls pin this same value. Read from
# the published StudyDesk-1.5.1.apk via `apksigner verify`.
AllowedAPKSigningKeys: 27e17d1fba157da6eacde58485aab56066200cc45ad00bd518d828367ec155e4

AntiFeatures:
  - NonFreeNet   # Supabase sync, Google OAuth, AI Edge Function (user-initiated HTTPS)

# Tags are v-prefixed (v1.5.2), so the version pattern needs the literal `v`.
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.5.2
CurrentVersionCode: 11
