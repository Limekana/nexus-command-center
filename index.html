<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0B0C0E" />
    <!--
      Content Security Policy. Restricts what the WebView/browser is allowed to
      execute and connect to, so an XSS or compromised CDN can't exfiltrate the
      user's Supabase session, Finnhub key, or stored PIN hash.

      script-src 'self' only — no inline scripts, no external script CDNs.
      style-src includes 'unsafe-inline' because Tailwind / Vite emit inline
      <style> blocks during HMR and for keyframes; this is the standard
      compromise for SPAs without a separate build step.
      connect-src enumerates every host the app legitimately calls out to.
      frame-ancestors is NOT here: browsers ignore it when it arrives via
      <meta>, and logged a console error for it. Clickjacking protection is
      delivered as a real Content-Security-Policy HTTP header instead — see
      the headers block in vercel.json. Nothing was lost moving it; it had
      never actually been in force from here.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://finnhub.io https://api.coingecko.com https://query1.finance.yahoo.com https://query2.finance.yahoo.com https://open.er-api.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <title>Nexus Command Center — a live dashboard for your other apps</title>
    <meta name="description" content="Reads live from StudyDesk and LimeLog. Study hours next to training volume next to spending, in about 1.5 seconds. Local-first, no subscription, no trackers." />
    <link rel="canonical" href="https://nexus.limecore.dev/" />
    <meta property="og:site_name" content="Limecore" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexus.limecore.dev/" />
    <meta property="og:title" content="Nexus Command Center — a live dashboard for your other apps" />
    <meta property="og:description" content="Reads live from StudyDesk and LimeLog. Study hours next to training volume next to spending, in about 1.5 seconds. Local-first, no subscription, no trackers." />
    <meta property="og:image" content="https://limecore.dev/og-home.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus Command Center — a live dashboard for your other apps" />
    <meta name="twitter:description" content="Reads live from StudyDesk and LimeLog. Study hours next to training volume next to spending, in about 1.5 seconds. Local-first, no subscription, no trackers." />
    <meta name="twitter:image" content="https://limecore.dev/og-home.png" />
    <!--
      Fonts are self-hosted (see @font-face in src/index.css). We used to pull
      IBM Plex from fonts.googleapis.com, but that render-blocking
      <link rel="stylesheet"> made the WebView's first paint depend on reaching
      Google — a device that's offline, or an F-Droid user who firewalls
      Google, could stall on it. Self-hosting also removes the third-party
      Google call, which F-Droid disallows.
    -->
  </head>
  <body>
    <!--
      Static loading fallback. Paints on the very first frame of the WebView,
      before Vite has finished loading the bundle. Gets replaced as soon as
      React mounts. Styled inline to match App.tsx's sessionLoading view so
      the handoff between this and React's loading screen is seamless — no
      black flash, no font swap pop.
    -->
    <div id="root">
      <div style="
        position: fixed;
        inset: 0;
        background: #0B0C0E;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7C828A;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 500;
      ">Loading</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
