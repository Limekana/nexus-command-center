name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # `npm ci` matters here: the caret on typescript resolves to a 6.x on a
      # fresh install, which hard-errors on the deprecated `baseUrl` in
      # tsconfig before compiling anything. The lockfile pins it.
      - name: Install
        run: npm ci

      # Scans every tracked file, not just staged ones — nothing is staged in
      # CI, so the default (hook) mode would pass vacuously.
      - name: Secret scan
        run: node scripts/check-secrets.mjs --all

      # The working agreement calls this gate mandatory. Two releases shipped
      # broken because it was skipped by hand; this makes it structural.
      # v1.12 Item 1. StudyDesk shipped `android.captureInput: true` for months,
      # which made CJK text entry impossible, because nobody has ever typed
      # Chinese into any of these apps. A one-line fix does not stop that
      # recurring; failing the build does.
      - name: IME guard
        run: node scripts/check-ime.mjs

      - name: Build gate
        run: npm run build

      # v1.16 (limecore#11). Characterization tests over the pure logic where a
      # silent change corrupts user data or money: the CSV importer, FIFO cost
      # basis, and the Dexie schema upgrade. They exist so the code-health pass
      # (limecore#12) has something to refactor against.
      - name: Test gate
        run: npm test
